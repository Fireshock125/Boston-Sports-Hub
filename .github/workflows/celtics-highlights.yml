name: Celtics official NBA highlights

on:
  workflow_dispatch:
  schedule:
    - cron: '20 11,23 * * *'

permissions:
  contents: write

concurrency:
  group: celtics-highlights
  cancel-in-progress: false

jobs:
  update-highlights:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: true
      - name: Find official NBA YouTube highlights
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python3 scripts/update_celtics_highlights.py
      - name: Commit updated highlights
        run: |
          if ! git diff --quiet -- celtics-highlights.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add celtics-highlights.json
            git commit -m "Refresh official Celtics YouTube highlights"
            git push
          fi
