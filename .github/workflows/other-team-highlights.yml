name: Boston teams YouTube highlights
on:
  workflow_dispatch:
  schedule:
    - cron: '40 11,23 * * *'
permissions:
  contents: write
concurrency:
  group: other-team-highlights
  cancel-in-progress: false
jobs:
  update-highlights:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: true
      - name: Search YouTube for three teams
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          for team in patriots; do
            HIGHLIGHTS_TEAM="$team" python3 scripts/update_other_highlights.py
          done
      - name: Commit updated highlights
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add patriots-highlights.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh Boston teams YouTube highlights"
            git push
          fi
