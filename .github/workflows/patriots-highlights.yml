name: Patriots YouTube highlights
on:
  workflow_dispatch:
  schedule:
    - cron: '35 14 * * *'
permissions:
  contents: write
concurrency:
  group: patriots-highlights
  cancel-in-progress: false
jobs:
  highlights:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Find Patriots game highlights
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python3 scripts/update_patriots_highlights.py
      - name: Save highlights feed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add patriots-highlights.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh Patriots highlights"
            git push
          fi
