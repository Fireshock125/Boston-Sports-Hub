
name: Update Boston Sports News

on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-news:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Collect latest Boston sports news
        run: python scripts/update_news.py

      - name: Save updated news
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add patriots-news.json celtics-news.json red-sox-news.json bruins-news.json

          if ! git diff --cached --quiet; then
            git commit -m "Update Boston sports news"
            git push
          fi
