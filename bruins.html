
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Boston Bruins | Boston Sports Hub</title>

  <style>
    :root {
      --bg: #101010;
      --panel: #1b1b1b;
      --panel-light: #252525;
      --text: #f5f5f5;
      --muted: #b7b7b7;
      --accent: #ffcc00;
      --border: #393939;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
      line-height: 1.5;
    }

    header {
      background: #080808;
      border-bottom: 3px solid var(--accent);
      padding: 24px 16px;
      text-align: center;
    }

    header h1 {
      margin: 0;
      color: var(--accent);
      font-size: 2rem;
    }

    header p {
      color: var(--muted);
      margin: 6px 0 0;
    }

    nav {
      position: sticky;
      top: 0;
      z-index: 10;
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 10px;
      padding: 12px;
      background: #151515;
      border-bottom: 1px solid var(--border);
    }

    nav a {
      color: var(--text);
      text-decoration: none;
      padding: 8px 13px;
      border-radius: 6px;
      font-weight: bold;
    }

    nav a:hover,
    nav a.active {
      background: var(--accent);
      color: #111;
    }

    main {
      max-width: 1100px;
      margin: 0 auto;
      padding: 24px 16px 40px;
    }

    section {
      margin-bottom: 36px;
      scroll-margin-top: 90px;
    }

    h2 {
      margin: 0 0 16px;
      font-size: 1.55rem;
    }

    .section-intro {
      color: var(--muted);
      margin-top: -8px;
      margin-bottom: 16px;
    }

    .tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 18px;
    }

    .tab {
      background: var(--panel-light);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 9px 13px;
      cursor: pointer;
      font-size: 0.9rem;
      font-weight: bold;
    }

    .tab:hover,
    .tab.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #111;
    }

    .games {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 14px;
    }

    .game {
      background: var(--panel);
      border: 1px solid var(--border);
      border-left: 4px solid var(--accent);
      border-radius: 9px;
      padding: 15px;
      min-width: 0;
    }

    .game-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
      margin-bottom: 12px;
    }

    .matchup {
      font-weight: bold;
      font-size: 1.05rem;
      overflow-wrap: anywhere;
    }

    .game-date {
      color: var(--muted);
      font-size: 0.85rem;
      text-align: right;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .game-times {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
      margin-top: 16px;
    }

    .game-time {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .game-time:last-child {
      text-align: right;
    }

    .time-label {
      color: var(--muted);
      font-size: 0.75rem;
    }

    .time-value {
      font-weight: bold;
      font-size: 0.95rem;
    }

    .score {
      color: var(--accent);
      font-size: 1.1rem;
      font-weight: bold;
      margin-top: 10px;
    }

    .status {
      color: var(--muted);
      font-size: 0.85rem;
      margin-top: 10px;
    }

    .message {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px;
      color: var(--muted);
    }

    .table-wrap {
      overflow-x: auto;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 650px;
      font-size: 0.9rem;
    }

    th,
    td {
      text-align: center;
      padding: 11px 9px;
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
    }

    th {
      background: #252525;
      color: var(--muted);
      font-size: 0.8rem;
      text-transform: uppercase;
    }

    th:nth-child(2),
    td:nth-child(2) {
      text-align: left;
    }

    tbody tr:last-child td {
      border-bottom: none;
    }

    tbody tr.bruins-row {
      background: rgba(255, 204, 0, 0.14);
      color: var(--accent);
      font-weight: bold;
    }

    .position {
      color: var(--muted);
      width: 45px;
    }

    footer {
      text-align: center;
      color: var(--muted);
      border-top: 1px solid var(--border);
      padding: 20px 12px;
      font-size: 0.85rem;
    }

    @media (max-width: 480px) {
      header h1 {
        font-size: 1.65rem;
      }

      main {
        padding: 20px 12px 32px;
      }

      .game-top {
        gap: 8px;
      }

      .matchup {
        font-size: 0.98rem;
      }

      .game-date {
        font-size: 0.78rem;
      }

      .time-value {
        font-size: 0.9rem;
      }
    }
  </style>
</head>

<body>
  <header>
    <h1>Boston Bruins</h1>
    <p>Boston Sports Hub · National Hockey League</p>
  </header>

  <nav>
    <a href="index.html">Home</a>
    <a href="#fixtures" class="active">Fixtures & Results</a>
    <a href="#standings">Standings</a>
  </nav>

  <main>
    <section id="fixtures">
      <h2>Fixtures & Results</h2>
      <div class="tabs">
        <button class="tab active" data-game-view="upcoming">Upcoming Fixtures</button>
        <button class="tab" data-game-view="results">Recent Results</button>
      </div>
      <div id="games" class="games">
        <div class="message">Loading Bruins fixtures...</div>
      </div>
    </section>

    <section id="standings">
      <h2>NHL Standings</h2>
      <p class="section-intro">Choose a table to view the league, conference or division standings.</p>

      <div class="tabs" id="standings-tabs">
        <button class="tab active" data-standing-view="overall">Overall NHL</button>
        <button class="tab" data-standing-view="east">Eastern Conference</button>
        <button class="tab" data-standing-view="west">Western Conference</button>
        <button class="tab" data-standing-view="atlantic">Atlantic Division</button>
        <button class="tab" data-standing-view="metropolitan">Metropolitan Division</button>
        <button class="tab" data-standing-view="central">Central Division</button>
        <button class="tab" data-standing-view="pacific">Pacific Division</button>
      </div>

      <div id="standings-table">
        <div class="message">Loading NHL standings...</div>
      </div>
    </section>
  </main>

  <footer>
    Boston Sports Hub · Let's go Bruins!
  </footer>

  <script>
    const SCHEDULE_URL =
      "https://site.api.espn.com/apis/site/v2/sports/hockey/nhl/teams/1/schedule";

    const STANDINGS_URL =
      "https://site.api.espn.com/apis/v2/sports/hockey/nhl/standings";

    let allGames = [];
    let allStandings = [];
    let currentGameView = "upcoming";
    let currentStandingView = "overall";

    const teamAliases = {
      "BOS": ["BOS"],
      "BUF": ["BUF"],
      "DET": ["DET"],
      "FLA": ["FLA"],
      "MTL": ["MTL"],
      "OTT": ["OTT"],
      "TBL": ["TBL", "TB"],
      "TOR": ["TOR"],
      "CAR": ["CAR"],
      "CBJ": ["CBJ"],
      "NJD": ["NJD", "NJ"],
      "NYI": ["NYI"],
      "NYR": ["NYR"],
      "PHI": ["PHI"],
      "PIT": ["PIT"],
      "WSH": ["WSH", "WAS"],
      "CHI": ["CHI"],
      "COL": ["COL"],
      "DAL": ["DAL"],
      "MIN": ["MIN"],
      "NSH": ["NSH"],
      "STL": ["STL"],
      "UTA": ["UTA"],
      "WPG": ["WPG"],
      "ANA": ["ANA"],
      "CGY": ["CGY"],
      "EDM": ["EDM"],
      "LAK": ["LAK", "LA"],
      "SJS": ["SJS", "SJ"],
      "SEA": ["SEA"],
      "VAN": ["VAN"],
      "VGK": ["VGK"]
    };

    const divisionTeams = {
      atlantic: ["BOS", "BUF", "DET", "FLA", "MTL", "OTT", "TBL", "TOR"],
      metropolitan: ["CAR", "CBJ", "NJD", "NYI", "NYR", "PHI", "PIT", "WSH"],
      central: ["CHI", "COL", "DAL", "MIN", "NSH", "STL", "UTA", "WPG"],
      pacific: ["ANA", "CGY", "EDM", "LAK", "SJS", "SEA", "VAN", "VGK"]
    };

    function safeText(value) {
      return String(value ?? "").replace(/[&<>"']/g, character => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
      })[character]);
    }

    function dateLabel(dateString) {
      if (!dateString) return "Date TBC";

      const date = new Date(dateString);
      if (Number.isNaN(date.getTime())) return "Date TBC";

      return new Intl.DateTimeFormat("en-GB", {
        timeZone: "Europe/London",
        weekday: "short",
        day: "numeric",
        month: "short",
        year: "numeric"
      }).format(date);
    }

    function timeLabel(dateString) {
      if (!dateString) return "TBC";

      const date = new Date(dateString);
      if (Number.isNaN(date.getTime())) return "TBC";

      return new Intl.DateTimeFormat("en-GB", {
        timeZone: "Europe/London",
        hour: "2-digit",
        minute: "2-digit",
        hour12: false
      }).format(date);
    }

    function americanTimeLabel(dateString, event) {
      if (!dateString) return "TBC";

      const date = new Date(dateString);
      if (Number.isNaN(date.getTime())) return "TBC";

      // Use the venue's timezone when ESPN supplies it.
      const venueTimezone =
        event?.competitions?.[0]?.venue?.address?.timeZone ||
        event?.competitions?.[0]?.venue?.timezone ||
        "America/New_York";

      try {
        return new Intl.DateTimeFormat("en-US", {
          timeZone: venueTimezone,
          hour: "numeric",
          minute: "2-digit",
          hour12: true,
          timeZoneName: "short"
        }).format(date);
      } catch {
        return new Intl.DateTimeFormat("en-US", {
          timeZone: "America/New_York",
          hour: "numeric",
          minute: "2-digit",
          hour12: true,
          timeZoneName: "short"
        }).format(date);
      }
    }

    function getCompetitors(event) {
      return event?.competitions?.[0]?.competitors || [];
    }

    function getTeamCode(team) {
      return (
        team?.team?.abbreviation ||
        team?.abbreviation ||
        ""
      ).toUpperCase();
    }

    function getTeamName(team) {
      return (
        team?.team?.displayName ||
        team?.team?.name ||
        team?.displayName ||
        team?.name ||
        "Team TBC"
      );
    }

    function getTeamShortName(team) {
      return (
        team?.team?.shortDisplayName ||
        team?.team?.name ||
        team?.shortDisplayName ||
        team?.name ||
        getTeamName(team)
      );
    }

    function getTeamScore(team) {
      const score = team?.score;

      if (score === null || score === undefined || score === "") {
        return null;
      }

      if (typeof score === "object") {
        const value = score.value ?? score.displayValue ?? score.score;
        return value === undefined || value === null ? null : String(value);
      }

      return String(score);
    }

    function gameDetails(event) {
      const competitors = getCompetitors(event);
      const home = competitors.find(team => team.homeAway === "home");
      const away = competitors.find(team => team.homeAway === "away");

      const isBruinsHome = getTeamCode(home) === "BOS";
      const opponent = isBruinsHome ? away : home;

      const homeScore = getTeamScore(home);
      const awayScore = getTeamScore(away);

      let scoreText = "";
      let outcome = "";

      if (homeScore !== null && awayScore !== null) {
        scoreText = `${getTeamShortName(away)} ${awayScore} – ${getTeamShortName(home)} ${homeScore}`;

        const bruinsScore = isBruinsHome ? homeScore : awayScore;
        const opponentScore = isBruinsHome ? awayScore : homeScore;

        if (Number(bruinsScore) > Number(opponentScore)) {
          outcome = "Bruins win";
        } else if (Number(bruinsScore) < Number(opponentScore)) {
          outcome = "Bruins loss";
        } else {
          outcome = "Draw";
        }
      }

      return {
        date: event?.date || event?.competitions?.[0]?.date,
        home,
        away,
        opponent: opponent ? getTeamName(opponent) : "Opponent TBC",
        homeAway: isBruinsHome ? "Home" : "Away",
        scoreText,
        outcome,
        eventStatus:
          event?.status?.type?.shortDetail ||
          event?.status?.type?.detail ||
          ""
      };
    }

    function renderGame(event, showResult) {
      const details = gameDetails(event);
      const competitors = getCompetitors(event);

      const home = competitors.find(team => team.homeAway === "home");
      const away = competitors.find(team => team.homeAway === "away");

      // Standard matchup format used on the main page and other team pages.
      const matchup = `${getTeamName(away)} @ ${getTeamName(home)}`;

      return `
        <article class="game">
          <div class="game-top">
            <span class="matchup">${safeText(matchup)}</span>
            <span class="game-date">${safeText(dateLabel(details.date))}</span>
          </div>

          ${
            showResult
              ? `
                <div class="score">${safeText(details.scoreText || "Score unavailable")}</div>
                <div class="status">
                  ${safeText(details.outcome)}
                  ${details.eventStatus ? " · " + safeText(details.eventStatus) : ""}
                </div>
              `
              : `
                <div class="game-times">
                  <div class="game-time">
                    <span class="time-label">American time</span>
                    <span class="time-value">${safeText(americanTimeLabel(details.date, event))}</span>
                  </div>

                  <div class="game-time">
                    <span class="time-label">UK time</span>
                    <span class="time-value">${safeText(timeLabel(details.date))}</span>
                  </div>
                </div>

                <div class="status">
                  ${safeText(details.homeAway)}
                  ${details.eventStatus ? " · " + safeText(details.eventStatus) : ""}
                </div>
              `
          }
        </article>
      `;
    }

    function renderGames() {
      const container = document.getElementById("games");

      const now = Date.now();

      const upcoming = allGames
        .filter(event => new Date(gameDetails(event).date).getTime() >= now)
        .sort((a, b) =>
          new Date(gameDetails(a).date) - new Date(gameDetails(b).date)
        );

      const results = allGames
        .filter(event => {
          const date = new Date(gameDetails(event).date).getTime();
          const status = String(gameDetails(event).eventStatus).toLowerCase();

          return date < now && (
            status.includes("final") ||
            status.includes("ended") ||
            status.includes("completed") ||
            getCompetitors(event).every(team => getTeamScore(team) !== null)
          );
        })
        .sort((a, b) =>
          new Date(gameDetails(b).date) - new Date(gameDetails(a).date)
        );

      const selectedGames = currentGameView === "upcoming"
        ? upcoming
        : results.slice(0, 20);

      if (!selectedGames.length) {
        container.innerHTML = `
          <div class="message">
            ${currentGameView === "upcoming"
              ? "No upcoming fixtures are currently available."
              : "No recent results are currently available."}
          </div>
        `;
        return;
      }

      container.innerHTML = selectedGames
        .map(event => renderGame(event, currentGameView === "results"))
        .join("");
    }

    function getAllEntries(node) {
      if (!node) return [];

      if (Array.isArray(node)) {
        return node;
      }

      if (Array.isArray(node.entries)) {
        return node.entries;
      }

      if (Array.isArray(node.team)) {
        return node.team;
      }

      return [];
    }

    function collectStandings(data) {
      const collected = [];

      function walk(node, label = "") {
        if (!node || typeof node !== "object") return;

        if (Array.isArray(node)) {
          node.forEach(item => walk(item, label));
          return;
        }

        const entries = getAllEntries(node);

        if (entries.length && entries.some(entry =>
          entry?.team || entry?.stats || entry?.records
        )) {
          collected.push({
            label: label || node.name || node.abbreviation || "",
            entries
          });
        }

        if (node.children) {
          node.children.forEach(child => {
            walk(child, child.name || child.abbreviation || label);
          });
        }

        if (node.groups) {
          node.groups.forEach(group => {
            walk(group, group.name || group.abbreviation || label);
          });
        }

        if (node.standings && node.standings !== node) {
          walk(node.standings, node.name || label);
        }
      }

      walk(data?.children || data?.standings?.children || data?.standings || data);

      return collected;
    }

    function getStat(entry, possibleNames) {
      const stats = entry?.stats || [];

      for (const name of possibleNames) {
        const found = stats.find(stat =>
          String(stat.name || stat.abbreviation || "").toLowerCase() === name.toLowerCase()
        );

        if (found) {
          return found.displayValue ?? found.value ?? "—";
        }
      }

      return "—";
    }

    function teamAbbreviation(entry) {
      return (
        entry?.team?.abbreviation ||
        entry?.team?.shortDisplayName ||
        entry?.team?.name ||
        ""
      ).toUpperCase();
    }

    function isBruins(entry) {
      return teamAbbreviation(entry) === "BOS";
    }

    function normaliseTeamCode(code) {
      const upper = String(code || "").toUpperCase();

      for (const [canonical, aliases] of Object.entries(teamAliases)) {
        if (aliases.includes(upper)) return canonical;
      }

      return upper;
    }

    function getRecord(entry) {
      const wins = getStat(entry, ["wins", "w"]);
      const losses = getStat(entry, ["losses", "l"]);
      const overtimeLosses = getStat(entry, ["ot", "overtimeLosses", "otl"]);

      return `${wins}-${losses}-${overtimeLosses}`;
    }

    function getPoints(entry) {
      return getStat(entry, ["points", "pts"]);
    }

    function getGoalDifference(entry) {
      return getStat(entry, ["differential", "goalDifferential", "diff", "gd"]);
    }

    function findEntriesByConference(conference) {
      const target = conference.toLowerCase();

      return allStandings.filter(group =>
        group.label.toLowerCase().includes(target)
      );
    }

    function getLeagueEntries() {
      const unique = new Map();

      allStandings.forEach(group => {
        group.entries.forEach(entry => {
          const code = normaliseTeamCode(teamAbbreviation(entry));
          if (code) unique.set(code, entry);
        });
      });

      return Array.from(unique.values());
    }

    function filterStandings(view) {
      const entries = getLeagueEntries();

      if (view === "overall") {
        return entries;
      }

      if (view === "east" || view === "west") {
        const matches = findEntriesByConference(
          view === "east" ? "eastern" : "western"
        );

        const conferenceEntries = new Map();

        matches.forEach(group => {
          group.entries.forEach(entry => {
            conferenceEntries.set(
              normaliseTeamCode(teamAbbreviation(entry)),
              entry
            );
          });
        });

        const result = Array.from(conferenceEntries.values());
        if (result.length) return result;

        // Fallback when the API supplies conference information on each entry.
        return entries.filter(entry => {
          const text = JSON.stringify(entry).toLowerCase();
          return view === "east"
            ? text.includes("eastern")
            : text.includes("western");
        });
      }

      if (divisionTeams[view]) {
        const wanted = divisionTeams[view];

        return entries.filter(entry =>
          wanted.includes(normaliseTeamCode(teamAbbreviation(entry)))
        );
      }

      return entries;
    }

    function sortStandings(entries) {
      return [...entries].sort((a, b) => {
        const aPoints = Number(getPoints(a));
        const bPoints = Number(getPoints(b));

        if (Number.isFinite(aPoints) && Number.isFinite(bPoints) && aPoints !== bPoints) {
          return bPoints - aPoints;
        }

        const aName = a?.team?.displayName || a?.team?.name || "";
        const bName = b?.team?.displayName || b?.team?.name || "";

        return aName.localeCompare(bName);
      });
    }

    function renderStandings() {
      const container = document.getElementById("standings-table");
      const entries = sortStandings(filterStandings(currentStandingView));

      if (!entries.length) {
        container.innerHTML = `
          <div class="message">
            Standings are temporarily unavailable. Please try again later.
          </div>
        `;
        return;
      }

      container.innerHTML = `
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Pos</th>
                <th>Team</th>
                <th>GP</th>
                <th>W-L-OTL</th>
                <th>PTS</th>
                <th>Goal Diff.</th>
              </tr>
            </thead>
            <tbody>
              ${entries.map((entry, index) => {
                const team = entry.team || {};
                const gamesPlayed = getStat(entry, ["gamesPlayed", "gp"]);
                const record = getRecord(entry);
                const points = getPoints(entry);
                const goalDiff = getGoalDifference(entry);

                return `
                  <tr class="${isBruins(entry) ? "bruins-row" : ""}">
                    <td class="position">${index + 1}</td>
                    <td>${safeText(team.displayName || team.name || "Unknown team")}</td>
                    <td>${safeText(gamesPlayed)}</td>
                    <td>${safeText(record)}</td>
                    <td>${safeText(points)}</td>
                    <td>${safeText(goalDiff)}</td>
                  </tr>
                `;
              }).join("")}
            </tbody>
          </table>
        </div>
      `;
    }

    async function loadSchedule() {
      const container = document.getElementById("games");

      try {
        const response = await fetch(SCHEDULE_URL);

        if (!response.ok) {
          throw new Error("Unable to load schedule");
        }

        const data = await response.json();
        allGames = data.events || [];

        renderGames();
      } catch (error) {
        container.innerHTML = `
          <div class="message">
            Couldn't load Bruins fixtures right now. Please refresh the page to try again.
          </div>
        `;
      }
    }

    async function loadStandings() {
      const container = document.getElementById("standings-table");

      try {
        const response = await fetch(STANDINGS_URL);

        if (!response.ok) {
          throw new Error("Unable to load standings");
        }

        const data = await response.json();
        allStandings = collectStandings(data);

        renderStandings();
      } catch (error) {
        container.innerHTML = `
          <div class="message">
            Couldn't load NHL standings right now. Please refresh the page to try again.
          </div>
        `;
      }
    }

    document.querySelectorAll("[data-game-view]").forEach(button => {
      button.addEventListener("click", () => {
        currentGameView = button.dataset.gameView;

        document.querySelectorAll("[data-game-view]").forEach(tab => {
          tab.classList.toggle("active", tab === button);
        });

        renderGames();
      });
    });

    document.querySelectorAll("[data-standing-view]").forEach(button => {
      button.addEventListener("click", () => {
        currentStandingView = button.dataset.standingView;

        document.querySelectorAll("[data-standing-view]").forEach(tab => {
          tab.classList.toggle("active", tab === button);
        });

        renderStandings();
      });
    });

    loadSchedule();
    loadStandings();
  </script>
</body>
</html>
