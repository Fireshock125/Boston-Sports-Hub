
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>New England Patriots | Boston Sports Hub</title>
<style>
:root {
  --accent: #c8102e;
  --bg: #080d18;
  --panel: #111b2d;
  --border: #26354c;
  --text: #f4f7fb;
  --muted: #aab7ca;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: Arial, Helvetica, sans-serif;
}
header {
  padding: 25px 16px;
  background: #101c31;
  border-bottom: 3px solid var(--accent);
}
.header-inner, main {
  width: min(100% - 28px, 950px);
  margin: auto;
}
h1 { margin: 0 0 8px; font-size: 28px; }
header p { margin: 0; color: var(--muted); }
nav {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  margin-top: 18px;
}
nav a {
  color: var(--text);
  text-decoration: none;
  padding: 9px 12px;
  background: #1b2a42;
  border-radius: 8px;
  font-size: 14px;
}
nav a:hover { background: var(--accent); }
main { padding: 22px 0 40px; }
section { margin-bottom: 30px; scroll-margin-top: 12px; }
h2 { font-size: 21px; margin: 0 0 12px; }
.section-note { color: var(--muted); font-size: 14px; margin: -4px 0 12px; }
#fixtures, #results, #standings {
  display: grid;
  gap: 10px;
}
.game, .table-wrap, .message {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 14px;
  min-width: 0;
}
.game { border-left: 4px solid var(--accent); }
.game-top {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 12px;
  color: var(--muted);
  font-size: 13px;
}
.game-top span:last-child { text-align: right; }
.matchup {
  font-size: 18px;
  font-weight: bold;
  margin: 12px 0;
  overflow-wrap: anywhere;
}
.status {
  color: var(--text);
  font-weight: bold;
}
.message { color: var(--muted); line-height: 1.5; }
.table-wrap { overflow-x: auto; }
table {
  width: 100%;
  border-collapse: collapse;
  font-size: 13px;
  white-space: nowrap;
}
th, td {
  text-align: left;
  padding: 11px 9px;
  border-bottom: 1px solid var(--border);
}
th { color: var(--muted); }
tr:last-child td { border-bottom: 0; }
tr.highlight { background: #30202b; font-weight: bold; }
footer {
  color: var(--muted);
  text-align: center;
  padding: 20px;
  font-size: 12px;
}
@media (max-width: 480px) {
  h1 { font-size: 24px; }
  .game-top { font-size: 12px; }
  .matchup { font-size: 16px; }
  th, td { padding: 9px 7px; }
}
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <h1>New England Patriots</h1>
    <p>Boston Sports Hub · NFL</p>
    <nav>
      <a href="index.html">Home</a>
      <a href="#fixtures">Fixtures</a>
      <a href="#results">Results</a>
      <a href="#standings">League standings</a>
    </nav>
  </div>
</header>

<main>
  <section id="fixtures">
    <h2>Upcoming fixtures</h2>
    <p class="section-note">All kick-off times are shown in UK local time.</p>
    <div class="message">Loading fixtures…</div>
  </section>

  <section id="results">
    <h2>Recent results</h2>
    <div class="message">Loading results…</div>
  </section>

  <section id="standings">
    <h2>NFL standings</h2>
    <div class="message">Loading league standings…</div>
  </section>
</main>

<footer>Boston Sports Hub · Data provided by ESPN</footer>

<script>
const TEAM_ID = "17";
const TEAM_NAME = "New England Patriots";
const SCHEDULE_URL =
  "https://site.api.espn.com/apis/site/v2/sports/football/nfl/teams/17/schedule";
const STANDINGS_URL =
  "https://site.api.espn.com/apis/v2/sports/football/nfl/standings";

function escapeHTML(value) {
  return String(value ?? "").replace(/[&<>"']/g, character => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#39;"
  })[character]);
}

function dateLabel(dateString) {
  const date = new Date(dateString);
  if (Number.isNaN(date.getTime())) return "Date TBC";
  return new Intl.DateTimeFormat("en-GB", {
    weekday: "short",
    day: "numeric",
    month: "short",
    year: "numeric",
    timeZone: "Europe/London"
  }).format(date);
}

function timeLabel(dateString) {
  const date = new Date(dateString);
  if (Number.isNaN(date.getTime())) return "Time TBC";
  return new Intl.DateTimeFormat("en-GB", {
    hour: "2-digit",
    minute: "2-digit",
    timeZone: "Europe/London",
    timeZoneName: "short"
  }).format(date);
}

function eventStatus(event) {
  return event.status?.type?.shortDetail
    || event.status?.type?.description
    || "Scheduled";
}

function isCompleted(event) {
  return event.status?.type?.completed === true;
}

function getCompetitors(event) {
  return event.competitions?.[0]?.competitors || [];
}

function teamForEvent(event) {
  const competitors = getCompetitors(event);
  return competitors.find(c =>
    String(c.team?.id) === TEAM_ID ||
    c.team?.displayName === TEAM_NAME ||
    c.team?.name === "Patriots"
  );
}

function scoreNumber(value) {
  if (value === null || value === undefined) return null;

  if (typeof value === "object") {
    value = value.displayValue
      ?? value.value
      ?? value.score
      ?? value.text
      ?? null;
  }

  if (value === null || value === undefined || value === "") return null;

  const number = Number(value);
  return Number.isFinite(number) ? number : null;
}

function parseEvent(event) {
  const competitors = getCompetitors(event);
  const home = competitors.find(c => c.homeAway === "home");
  const away = competitors.find(c => c.homeAway === "away");
  const ownTeam = teamForEvent(event);
  const opponent = competitors.find(c => c !== ownTeam);

  const ownScore = scoreNumber(ownTeam?.score);
  const opponentScore = scoreNumber(opponent?.score);
  const completed = isCompleted(event);

  let outcome = "";
  if (completed && ownScore !== null && opponentScore !== null) {
    outcome = ownScore > opponentScore ? "Win"
      : ownScore < opponentScore ? "Loss"
      : "Tie";
  }

  return {
    id: event.id,
    date: event.date,
    home: home?.team?.displayName || "Home team TBC",
    away: away?.team?.displayName || "Away team TBC",
    status: eventStatus(event),
    completed,
    ownScore,
    opponentScore,
    outcome
  };
}

function fixtureCard(game) {
  return `
    <article class="game">
      <div class="game-top">
        <span>NFL · ${escapeHTML(TEAM_NAME)}</span>
        <span>${escapeHTML(dateLabel(game.date))}</span>
      </div>
      <div class="matchup">
        ${escapeHTML(game.away)} @ ${escapeHTML(game.home)}
      </div>
      <div class="game-top">
        <span>${escapeHTML(timeLabel(game.date))}</span>
        <span class="status">${escapeHTML(game.status)}</span>
      </div>
    </article>`;
}

function resultCard(game) {
  const score = game.ownScore === null || game.opponentScore === null
    ? "Score unavailable"
    : `${game.ownScore} – ${game.opponentScore}`;

  const resultLine = game.outcome
    ? `Final · ${score} · ${game.outcome}`
    : `Final · ${score}`;

  return `
    <article class="game">
      <div class="game-top">
        <span>NFL · ${escapeHTML(TEAM_NAME)}</span>
        <span>${escapeHTML(dateLabel(game.date))}</span>
      </div>
      <div class="matchup">
        ${escapeHTML(game.away)} @ ${escapeHTML(game.home)}
      </div>
      <div class="game-top">
        <span class="status">${escapeHTML(resultLine)}</span>
        <span>Completed</span>
      </div>
    </article>`;
}

function getStat(stats, names) {
  for (const name of names) {
    const item = stats.find(stat =>
      stat.name === name || stat.abbreviation === name
    );
    if (item && item.displayValue !== undefined) return item.displayValue;
    if (item && item.value !== undefined) return item.value;
  }
  return "—";
}

function findTeamInStandings(node) {
  if (!node || typeof node !== "object") return null;

  const entries = node.entries || [];
  for (const entry of entries) {
    const team = entry.team || {};
    if (
      String(team.id) === TEAM_ID ||
      team.displayName === TEAM_NAME ||
      team.name === "Patriots"
    ) {
      return entry;
    }
  }

  for (const child of node.children || []) {
    const found = findTeamInStandings(child);
    if (found) return found;
  }

  return null;
}

function renderStandings(data) {
  const container = document.getElementById("standings");
  const allEntries = [];

  function collect(node) {
    if (!node || typeof node !== "object") return;
    for (const entry of node.entries || []) allEntries.push(entry);
    for (const child of node.children || []) collect(child);
  }

  collect(data);

  if (!allEntries.length) {
    container.innerHTML = `
      <h2>NFL standings</h2>
      <div class="message">Standings are not available right now.</div>`;
    return;
  }

  const patriotsEntry = findTeamInStandings(data);
  const rows = allEntries.map(entry => {
    const team = entry.team || {};
    const stats = entry.stats || [];
    const isPatriots =
      String(team.id) === TEAM_ID ||
      team.displayName === TEAM_NAME ||
      team.name === "Patriots";

    return {
      isPatriots,
      html: `<tr class="${isPatriots ? "highlight" : ""}">
        <td>${escapeHTML(team.displayName || team.name || "Team")}</td>
        <td>${escapeHTML(getStat(stats, ["wins", "W"]))}</td>
        <td>${escapeHTML(getStat(stats, ["losses", "L"]))}</td>
        <td>${escapeHTML(getStat(stats, ["ties", "T"]))}</td>
        <td>${escapeHTML(getStat(stats, ["winPercent", "PCT"]))}</td>
        <td>${escapeHTML(getStat(stats, ["pointsFor", "PF"]))}</td>
        <td>${escapeHTML(getStat(stats, ["pointsAgainst", "PA"]))}</td>
        <td>${escapeHTML(getStat(stats, ["streak", "STRK"]))}</td>
      </tr>`
    };
  });

  rows.sort((a, b) => Number(b.isPatriots) - Number(a.isPatriots));

  container.innerHTML = `
    <h2>NFL standings</h2>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Team</th><th>W</th><th>L</th><th>T</th>
            <th>PCT</th><th>PF</th><th>PA</th><th>Streak</th>
          </tr>
        </thead>
        <tbody>${rows.map(row => row.html).join("")}</tbody>
      </table>
    </div>`;
}

async function loadSchedule() {
  const fixtureSection = document.getElementById("fixtures");
  const resultSection = document.getElementById("results");

  try {
    const response = await fetch(SCHEDULE_URL);
    if (!response.ok) throw new Error("Schedule request failed");

    const data = await response.json();
    const events = (data.events || [])
      .map(parseEvent)
      .filter(game => game.date)
      .sort((a, b) => new Date(a.date) - new Date(b.date));

    const upcoming = events.filter(game => !game.completed);
    const completed = events.filter(game => game.completed).reverse();

    fixtureSection.innerHTML = `
      <h2>Upcoming fixtures</h2>
      <p class="section-note">All kick-off times are shown in UK local time.</p>
      ${upcoming.length
        ? upcoming.map(fixtureCard).join("")
        : '<div class="message">No upcoming fixtures are currently listed.</div>'}`;

    resultSection.innerHTML = `
      <h2>Recent results</h2>
      ${completed.length
        ? completed.slice(0, 10).map(resultCard).join("")
        : '<div class="message">No completed results are currently listed.</div>'}`;
  } catch (error) {
    fixtureSection.innerHTML = `
      <h2>Upcoming fixtures</h2>
      <div class="message">Could not load fixtures. Please refresh the page and try again.</div>`;
    resultSection.innerHTML = `
      <h2>Recent results</h2>
      <div class="message">Could not load results. Please refresh the page and try again.</div>`;
    console.error("Patriots schedule error:", error);
  }
}

async function loadStandings() {
  const container = document.getElementById("standings");

  try {
    const response = await fetch(STANDINGS_URL);
    if (!response.ok) throw new Error("Standings request failed");
    const data = await response.json();
    renderStandings(data);
  } catch (error) {
    container.innerHTML = `
      <h2>NFL standings</h2>
      <div class="message">Could not load standings. Please refresh the page and try again.</div>`;
    console.error("NFL standings error:", error);
  }
}

loadSchedule();
loadStandings();
</script>

</body>
</html>
